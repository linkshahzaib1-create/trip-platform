# TripPlatform Blueprint — free web (Docker) + free Postgres
# Deploy: Render Dashboard → New → Blueprint → select this repo
databases:
  - name: trip-platform-db
    plan: free
    databaseName: tripplatform
    user: trip

services:
  - type: web
    name: trip-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: trip-platform-db
          property: connectionString
